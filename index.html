<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Tính công</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="screen-loading" id="loadingScreen">Đang tải…</div>

<!-- AUTH SCREEN -->
<div class="screen-auth" id="authScreen" style="display:none">
  <div class="auth-card">
    <div class="auth-logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
    </div>
    <h1 class="auth-title" id="authTitle">Đăng nhập</h1>

    <form id="authForm" autocomplete="on" novalidate>
      <div class="auth-field" id="nameField" style="display:none">
        <label for="authName">Tên người dùng</label>
        <div class="auth-input-wrap">
          <svg class="auth-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" id="authName" placeholder="VD: Quang Trung">
        </div>
      </div>

      <div class="auth-field">
        <label for="authEmail">Tên đăng nhập</label>
        <div class="auth-input-wrap">
          <svg class="auth-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" id="authEmail" required autocomplete="username" placeholder="Tên đăng nhập" inputmode="email">
        </div>
      </div>
      
      <div class="auth-field">
        <label for="authPassword">Mật khẩu</label>
        <div class="auth-input-wrap">
          <svg class="auth-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="authPassword" required minlength="6" autocomplete="current-password" placeholder="Mật khẩu">
          <button type="button" class="auth-toggle-pw" id="togglePw" aria-label="Hiện/ẩn mật khẩu">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="auth-field" id="confirmPwField" style="display:none">
        <label for="authConfirmPw">Gõ lại mật khẩu</label>
        <div class="auth-input-wrap">
          <svg class="auth-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="authConfirmPw" placeholder="Gõ lại mật khẩu">
        </div>
      </div>
      
      <label class="auth-remember" id="rememberWrap">
        <input type="checkbox" id="rememberMe">
        <span>Ghi nhớ đăng nhập</span>
      </label>
      
      <div class="auth-error" id="authError"></div>
      
      <button type="submit" class="auth-submit" id="authSubmit">
        <span id="authSubmitText">Đăng nhập</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </form>
    
    <div class="auth-switch">
      <span id="switchText">Chưa có tài khoản?</span>
      <button type="button" id="btnSwitchMode">Đăng ký</button>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div class="app" id="mainApp" style="display:none">
  
  <header class="hdr" id="mainHeader">
    <div class="hdr-wrap">
      <div class="segmented-control">
        <button class="seg-btn" id="prevMonth" aria-label="Tháng trước">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="seg-label" id="monthLabel">Tháng —<span class="caret">▾</span></button>
        <button class="seg-btn" id="nextMonth" aria-label="Tháng sau">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
      
      <div class="hdr-actions" id="hdrActions">
        <button class="iconbtn" id="btnHelp" aria-label="Chú thích">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        </button>
        <button class="avatar-btn" id="avatarBtn" aria-label="Tài khoản">
          <span class="avatar-initial" id="avatarInitial">?</span>
          <img class="avatar-img" id="avatarImg" alt="">
        </button>
      </div>
    </div>

    <div class="dropdown" id="dropdown">
      <div class="dd-user">
        <div class="dd-avatar" id="ddAvatar">
          <span class="avatar-initial" id="ddInitial">?</span>
          <img class="avatar-img" id="ddImg" alt="">
        </div>
        <div class="dd-info">
          <div class="dd-name" id="ddName">—</div>
          <div class="dd-role" id="ddRole">—</div>
        </div>
      </div>
      <button type="button" class="dd-item" data-action="profile">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Hồ sơ cá nhân
      </button>
      <button type="button" class="dd-item" data-action="settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Cài đặt
      </button>
      <button type="button" class="dd-item" data-action="admin" id="ddAdmin" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Quản lý người dùng
      </button>
      <button type="button" class="dd-item" data-action="theme" id="ddTheme">
        <span id="themeIcon" style="display:flex;align-items:center;"></span>
        <span id="themeText">Giao diện tối</span>
      </button>
      <button type="button" class="dd-item danger" data-action="logout">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Đăng xuất
      </button>
    </div>
  </header>

  <section class="card stats">
    <div class="stat s-work"><span class="lbl">Công TT</span><strong id="stWork">0</strong></div>
    <div class="stat s-actual"><span class="lbl">Công lương</span><strong id="stActual">0</strong></div>
    <div class="stat s-truc"><span class="lbl">Trực</span><strong id="stTruc">0</strong></div>
    <div class="stat s-ct"><span class="lbl">CT</span><strong id="stCt">0</strong></div>
    <div class="stat s-rank" id="statRank"><span class="lbl">Loại</span><strong id="stRank">–</strong></div>
    
    <div class="target-bar-wrap">
      <div class="target-info">
        <span>Tiến độ công lương</span>
        <span><b id="stActual2">0</b> / <span id="stCap">24</span></span>
      </div>
      <div class="target-bar"><div class="target-fill" id="targetFill"></div></div>
    </div>
  </section>

  <section class="card">
    <div class="card-hd">
      <h2 class="card-title">Lịch chấm công</h2>
      <div class="hd-actions">
        <button class="link" id="btnFillX">T2–T6</button>
        <button class="link" id="btnFillT7">T2–T7</button>
        <button class="link danger" id="btnClear">Xóa</button>
      </div>
    </div>
    <div class="cal-head">
      <span>T2</span><span>T3</span><span>T4</span><span>T5</span>
      <span>T6</span><span>T7</span><span class="sun">CN</span>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <p class="cal-hint"><b>Chạm vào một ngày</b> để nhập công cho ngày đó.</p>
  </section>
</div>

<div class="bottombar" id="bottombar" style="display:none">
  <div class="bb-left"><span>Thực lĩnh</span><strong id="bbTake">0 đ</strong></div>
  <button class="btn primary" id="bbDetail">Chi tiết</button>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-handle"></div>
  <header class="sh-hd">
    <div class="sh-date" id="sheetTitle"></div>
    <button class="sh-x" id="sheetClose" aria-label="Đóng">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </header>
  <div class="sh-body" id="sheetBody"></div>
  <footer class="sh-ft" id="sheetActions"></footer>
</div>

<!-- ADD MODAL -->
<div class="modal-backdrop" id="addModalBackdrop"></div>
<div class="modal" id="addModal">
  <div class="modal-hd">
    <div class="modal-title" id="addModalTitle">Thêm khoản</div>
    <button class="modal-close" id="addModalClose">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="modal-body">
    <div class="field" style="margin-top:0;">
      <label>Tên mục</label>
      <input type="text" id="newItemName" placeholder="VD: Tiền ăn ca">
    </div>
    <div class="field">
      <label>Số tiền (đ)</label>
      <input type="number" id="newItemValue" placeholder="0">
    </div>
    <div class="field" id="newItemTypeWrap">
      <label>Kiểu tính</label>
      <select id="newItemType" style="height:46px; border-radius:12px; border:1px solid var(--border); padding:0 14px; background:var(--bg); color:var(--text); font:inherit;">
        <option value="fixed">Cố định (Cộng thẳng)</option>
        <option value="calc">Tính theo công (chia công chuẩn)</option>
      </select>
    </div>
  </div>
  <div class="modal-ft">
    <button class="btn ghost" id="addModalCancel" style="flex:1;">Hủy</button>
    <button class="btn primary" id="addModalSave" style="flex:1;">Lưu</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="avatarInput" accept="image/*" style="display:none">

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<!-- Custom Scripts -->
<script src="firebase.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
</body>
</html>
